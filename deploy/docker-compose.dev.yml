# ShopNex with its database and the Stripe app, each in its own container:
#
#   docker compose -f deploy/docker-compose.dev.yml up --build   # --profile cj / --profile shippo adds those apps
#
# (run from the repo root)
# For contributors who build from source; to just run ShopNex use
# deploy/docker-compose.yml, which pulls prebuilt GHCR images and needs no setup.
#
# The apps are separate containers on their own public URL (a subdomain each), because browsers and Stripe
# reach them directly. Put a reverse proxy / platform routing in front of 3000 (ShopNex) and 4600 (Stripe).
# Each app has its own private key: set STRIPE_APP_KEY=snxk_… in .env (CJ_DROPSHIPPING_APP_KEY and
# SHIPPO_APP_KEY for those profiles). Make one with:
#   node -e "crypto.subtle.generateKey('Ed25519',true,['sign']).then(async k=>console.log('snxk_'+Buffer.from(await crypto.subtle.exportKey('pkcs8',k.privateKey)).toString('base64url')))"
# Keep it with your other secrets: it seals the keys merchants save in the app (a copy of the database alone cannot
# unseal them), and a new key makes it a new app, so merchants reconnect. The apps keep nothing else outside Postgres.
name: shopnex

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shopnex
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    ports:
      - '3000:3000'
    volumes:
      - data:/data
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shopnex
      APP_URL: '${APP_URL:-http://localhost:3000}'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SHOPNEX_SECRET: ${SHOPNEX_SECRET:-}
      # Look for the bundled apps (stripe, cj-dropshipping, shippo) at their service names on this network
      SHOPNEX_BUNDLED_APPS: docker

  stripe:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args: { APP: stripe }
    ports:
      - '4600:4600'
    depends_on:
      db: { condition: service_healthy }
    environment:
      STRIPE_APP_URL: '${STRIPE_APP_URL:-http://localhost:4600}'
      SHOPNEX_INTERNAL_URL: http://admin:3000
      APP_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shopnex
      STRIPE_APP_KEY: '${STRIPE_APP_KEY:?Set STRIPE_APP_KEY in .env, the private key of the Stripe app (see the top of this file)}'

  cj-dropshipping:
    profiles: [cj]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args: { APP: cj-dropshipping }
    ports:
      - '4700:4700'
    depends_on:
      db: { condition: service_healthy }
    environment:
      CJ_DROPSHIPPING_APP_URL: '${CJ_DROPSHIPPING_APP_URL:-http://localhost:4700}'
      SHOPNEX_INTERNAL_URL: http://admin:3000
      PORT: 4700
      APP_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shopnex
      CJ_DROPSHIPPING_APP_KEY: ${CJ_DROPSHIPPING_APP_KEY:-}

  shippo:
    profiles: [shippo]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args: { APP: shippo }
    ports:
      - '4900:4900'
    depends_on:
      db: { condition: service_healthy }
    environment:
      SHIPPO_APP_URL: '${SHIPPO_APP_URL:-http://localhost:4900}'
      SHOPNEX_INTERNAL_URL: http://admin:3000
      PORT: 4900
      APP_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shopnex
      SHIPPO_APP_KEY: ${SHIPPO_APP_KEY:-}

volumes:
  db:
  data:
