# Same stack as docker-compose.yml, without host `ports:`, for Dokploy, Coolify and other platforms whose proxy
# routes domains to containers over the Docker network. Published host ports (3000, 4600, 4700, 4900) collide with the
# proxy or with other apps on the server and fail the first deploy. Add domains in the platform instead:
# shopnex -> 3000, stripe -> 4600, cj-dropshipping -> 4700, shippo -> 4900. Keep the rest in sync with docker-compose.yml.
# Set APP_URL and STRIPE_APP_URL, and pin SHOPNEX_VERSION to a release tag (for example v1.2.3).
# Optional apps are off by default. CJ Dropshipping: COMPOSE_PROFILES=cj, plus CJ_DROPSHIPPING_APP_URL for its domain.
# Shippo: COMPOSE_PROFILES=shippo (comma-separate to enable both), plus SHIPPO_APP_URL.
# The services that get a domain are also on `dokploy-network`, which is how the proxy (Traefik) reaches them; without
# it the domain answers 502 or 404. `default` stays in each list: it is how they reach `db` and each other.
name: shopnex

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopnex
      POSTGRES_PASSWORD: shopnex
      POSTGRES_DB: shopnex
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopnex']
      interval: 5s
      timeout: 5s
      retries: 10

  shopnex:
    image: ghcr.io/shopnex-ai/shopnex:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    networks: [default, dokploy-network]
    volumes:
      - shopnex_data:/data
    environment:
      DATABASE_URL: postgres://shopnex:shopnex@db:5432/shopnex
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SHOPNEX_SECRET: ${SHOPNEX_SECRET:-}
      # Multi-shop (a public demo or SaaS): TENANCY_MODE=multi, OPEN_SIGNUP=true lets anyone create a shop, ROOT_DOMAIN
      # serves every shop at <slug>.ROOT_DOMAIN (see docs: Concepts > Tenancy). The defaults keep a single shop.
      TENANCY_MODE: ${TENANCY_MODE:-single}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      # The one host that serves /admin (others redirect to it). Defaults to the host of APP_URL in multi mode.
      ADMIN_HOST: ${ADMIN_HOST:-}
      # Open sign-up limits (OPEN_SIGNUP=true): per address and for everyone, per hour. Behind Cloudflare set
      # CLIENT_IP_HEADER=cf-connecting-ip so each visitor is told apart (see docs: Concepts > Tenancy).
      SIGNUP_RATE_PER_IP: ${SIGNUP_RATE_PER_IP:-}
      SIGNUP_RATE_GLOBAL: ${SIGNUP_RATE_GLOBAL:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      DEFAULT_SHOP_NAME: ${DEFAULT_SHOP_NAME:-My Shop}
      # Look for the bundled apps (stripe, cj-dropshipping, shippo) at their service names on this network
      SHOPNEX_BUNDLED_APPS: docker
    # Multi-shop only (TENANCY_MODE=multi): routes every <slug>.ROOT_DOMAIN to this service, next to the domain added
    # in Dokploy (the admin). ROOT_DOMAIN is the bare domain, e.g. shopnex.app, with a wildcard DNS record (*) pointing
    # at the server. With ROOT_DOMAIN unset it matches no host. priority=1 keeps the admin's own domain on its own route.
    # `$$` is a literal `$` in Compose. The router names its service because the container has several (Dokploy adds
    # its own for the admin domain), and Traefik won't pick one. Behind a CDN that terminates TLS (Cloudflare, SSL mode
    # Full) the default certificate is enough: this route has no certificate resolver, as a wildcard needs DNS-01.
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.shopnex-shops.rule=HostRegexp(`^[a-z0-9-]+\.${ROOT_DOMAIN:-none}$$`)
      - traefik.http.routers.shopnex-shops.entrypoints=websecure
      - traefik.http.routers.shopnex-shops.tls=true
      - traefik.http.routers.shopnex-shops.priority=1
      - traefik.http.routers.shopnex-shops.service=shopnex-shops
      - traefik.http.services.shopnex-shops.loadbalancer.server.port=3000

  stripe:
    image: ghcr.io/shopnex-ai/shopnex-stripe:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [default, dokploy-network]
    volumes:
      - stripe_data:/data
    environment:
      STRIPE_APP_URL: ${STRIPE_APP_URL:-http://localhost:4600}
      SHOPNEX_INTERNAL_URL: http://shopnex:3000
      DATA_DIR: /data

  cj-dropshipping:
    profiles: [cj]
    image: ghcr.io/shopnex-ai/shopnex-cj-dropshipping:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [default, dokploy-network]
    volumes:
      - cj_dropshipping_data:/data
    environment:
      CJ_DROPSHIPPING_APP_URL: ${CJ_DROPSHIPPING_APP_URL:-http://localhost:4700}
      SHOPNEX_INTERNAL_URL: http://shopnex:3000
      PORT: 4700
      DATA_DIR: /data

  shippo:
    profiles: [shippo]
    image: ghcr.io/shopnex-ai/shopnex-shippo:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    networks: [default, dokploy-network]
    volumes:
      - shippo_data:/data
    environment:
      SHIPPO_APP_URL: ${SHIPPO_APP_URL:-http://localhost:4900}
      SHOPNEX_INTERNAL_URL: http://shopnex:3000
      PORT: 4900
      DATA_DIR: /data

networks:
  dokploy-network:
    external: true

volumes:
  db:
  shopnex_data:
  stripe_data:
  cj_dropshipping_data:
  shippo_data:
