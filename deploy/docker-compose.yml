# Production deployment using matching, versioned Shopnex and Stripe images.
# Set SHOPNEX_VERSION to a published release tag (for example v1.2.3).
name: shopnex

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopnex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: shopnex
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopnex']
      interval: 5s
      timeout: 5s
      retries: 10

  shopnex:
    image: ghcr.io/shopnex-ai/shopnex:${SHOPNEX_VERSION:?set SHOPNEX_VERSION to a release tag}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - '3000:3000'
    volumes:
      - shopnex_data:/data
    environment:
      DATABASE_URL: postgres://shopnex:${POSTGRES_PASSWORD}@db:5432/shopnex
      APP_URL: ${APP_URL:?set APP_URL to the public Shopnex URL}
      BETTER_AUTH_URL: ${APP_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      TENANCY_MODE: single
      DEFAULT_SHOP_NAME: ${DEFAULT_SHOP_NAME:-My Shop}
      STRIPE_APP_URL: ${STRIPE_APP_URL:?set STRIPE_APP_URL to the public Stripe app URL}

  stripe:
    image: ghcr.io/shopnex-ai/shopnex-stripe:${SHOPNEX_VERSION:?set SHOPNEX_VERSION to a release tag}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '4600:4600'
    volumes:
      - stripe_data:/data
    environment:
      STRIPE_APP_URL: ${STRIPE_APP_URL:?set STRIPE_APP_URL to the public Stripe app URL}
      DATA_DIR: /data

volumes:
  db:
  shopnex_data:
  stripe_data:
