# ShopNex, its Stripe app and Postgres from prebuilt images: `docker compose up`, then open http://localhost:3000.
# Every variable has a local default. For a public deployment set APP_URL and STRIPE_APP_URL
# (env or a .env file next to this one), and pin SHOPNEX_VERSION to a release tag (for example v1.2.3).
# HTTPS: set DOMAIN=shop.example.com (DNS pointing at this host, ports 80 and 443 open) and Caddy inside the shopnex
# container gets a Let's Encrypt certificate by itself; APP_URL defaults to https://$DOMAIN.
# The Stripe, CJ and Shippo apps are served at https://stripe.$DOMAIN, https://cj.$DOMAIN and https://shippo.$DOMAIN: point those DNS records at this host too.
# Optional apps are off by default. CJ Dropshipping: `docker compose --profile cj up`; Shippo: `--profile shippo`. ShopNex finds the apps on the
# compose network and each app announces its own public URL, so only a custom domain needs setting: STRIPE_APP_URL /
# CJ_DROPSHIPPING_APP_URL / SHIPPO_APP_URL (on the app service).
# Each app has its own private key: set STRIPE_APP_KEY=snxk_… in .env (CJ_DROPSHIPPING_APP_KEY and
# SHIPPO_APP_KEY for those profiles). Make one with:
#   node -e "crypto.subtle.generateKey('Ed25519',true,['sign']).then(async k=>console.log('snxk_'+Buffer.from(await crypto.subtle.exportKey('pkcs8',k.privateKey)).toString('base64url')))"
# Keep it with your other secrets: it seals the keys merchants save in the app (ShopNex stores them sealed, so a copy of
# its database alone cannot unseal them), and a new key makes it a new app, so merchants reconnect. Only CJ
# Dropshipping has tables of its own (a schema in this Postgres); no app writes to a volume.
name: shopnex

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopnex
      # The database is only reachable on the compose network, so a fixed credential is enough
      POSTGRES_PASSWORD: shopnex
      POSTGRES_DB: shopnex
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopnex']
      interval: 5s
      timeout: 5s
      retries: 10

  shopnex:
    image: ghcr.io/shopnex-ai/shopnex:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - '3000:3000'
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - shopnex_data:/data
    environment:
      DATABASE_URL: postgres://shopnex:shopnex@db:5432/shopnex
      DOMAIN: ${DOMAIN:-}
      APP_URL: ${APP_URL:-${DOMAIN:+https://}${DOMAIN:-http://localhost:3000}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SHOPNEX_SECRET: ${SHOPNEX_SECRET:-}
      # Multi-shop (a public demo or SaaS): TENANCY_MODE=multi, OPEN_SIGNUP=true lets anyone create a shop, ROOT_DOMAIN
      # serves every shop at <slug>.ROOT_DOMAIN (see docs: Concepts > Tenancy). The defaults keep a single shop.
      TENANCY_MODE: ${TENANCY_MODE:-single}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      # The one host that serves /admin (others redirect to it). Defaults to the host of APP_URL in multi mode.
      ADMIN_HOST: ${ADMIN_HOST:-}
      # Open sign-up limits (OPEN_SIGNUP=true): per address and for everyone, per hour. Behind Cloudflare set
      # CLIENT_IP_HEADER=cf-connecting-ip so each visitor is told apart (see docs: Concepts > Tenancy).
      SIGNUP_RATE_PER_IP: ${SIGNUP_RATE_PER_IP:-}
      SIGNUP_RATE_GLOBAL: ${SIGNUP_RATE_GLOBAL:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      DEFAULT_SHOP_NAME: ${DEFAULT_SHOP_NAME:-My Shop}
      # Look for the bundled apps (stripe, cj-dropshipping, shippo) at their service names on this network
      SHOPNEX_BUNDLED_APPS: docker

  stripe:
    image: ghcr.io/shopnex-ai/shopnex-stripe:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '4600:4600'
    environment:
      STRIPE_APP_URL: ${STRIPE_APP_URL:-${DOMAIN:+https://stripe.}${DOMAIN:-http://localhost:4600}}
      SHOPNEX_INTERNAL_URL: http://shopnex:3000
      STRIPE_APP_KEY: '${STRIPE_APP_KEY:?Set STRIPE_APP_KEY in .env, the private key of the Stripe app (see the top of this file)}'

  cj-dropshipping:
    profiles: [cj]
    image: ghcr.io/shopnex-ai/shopnex-cj-dropshipping:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '4700:4700'
    depends_on:
      db: { condition: service_healthy }
    environment:
      CJ_DROPSHIPPING_APP_URL: ${CJ_DROPSHIPPING_APP_URL:-${DOMAIN:+https://cj.}${DOMAIN:-http://localhost:4700}}
      SHOPNEX_INTERNAL_URL: http://shopnex:3000
      PORT: 4700
      APP_DATABASE_URL: postgres://shopnex:shopnex@db:5432/shopnex
      CJ_DROPSHIPPING_APP_KEY: ${CJ_DROPSHIPPING_APP_KEY:-}

  shippo:
    profiles: [shippo]
    image: ghcr.io/shopnex-ai/shopnex-shippo:${SHOPNEX_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '4900:4900'
    environment:
      SHIPPO_APP_URL: ${SHIPPO_APP_URL:-${DOMAIN:+https://shippo.}${DOMAIN:-http://localhost:4900}}
      SHOPNEX_INTERNAL_URL: http://shopnex:3000
      PORT: 4900
      SHIPPO_APP_KEY: ${SHIPPO_APP_KEY:-}

volumes:
  db:
  shopnex_data:
