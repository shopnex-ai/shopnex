name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fails a PR that adds or updates a dependency with a known high or critical vulnerability
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
