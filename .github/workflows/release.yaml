name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Check and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Pre-releases (v1.0.0-rc.1) don't move the latest tag
          latest=false
          if [[ "$TAG" != *-* ]]; then latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ github.ref_name }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.tags.outputs.latest == 'true' && format('{0}:latest', steps.image.outputs.name) || '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          build-args: APP=stripe
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-stripe:${{ github.ref_name }}
            ${{ steps.tags.outputs.latest == 'true' && format('{0}-stripe:latest', steps.image.outputs.name) || '' }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags like v1.0.0-rc.1 are marked as pre-releases
          flags="--generate-notes --verify-tag"
          if [[ "$TAG" == *-* ]]; then flags="$flags --prerelease"; fi
          gh release create "$TAG" $flags --title "$TAG"

      - name: Attach images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # Offline copies, load with: gunzip -c <file> | docker load
          for ref in "$IMAGE:$TAG" "$IMAGE-stripe:$TAG"; do
            docker pull --platform linux/amd64 "$ref"
            file="$(basename "${ref%%:*}")-$TAG-linux-amd64.tar.gz"
            docker save "$ref" | gzip > "$file"
            gh release upload "$TAG" "$file"
          done

      - name: Add image reference to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          STRIPE_IMAGE: ${{ steps.image.outputs.name }}-stripe
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          {
            printf '\n\n## Docker image\n\n'
            printf 'Shopnex: `docker pull %s:%s`\n\n' "$IMAGE" "$TAG"
            printf 'Stripe app: `docker pull %s:%s`\n\n' "$STRIPE_IMAGE" "$TAG"
            printf 'Offline `.tar.gz` copies of both images are attached below.\n'
          } >> release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
