name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

  # Each image is built natively per architecture (no emulation) and pushed by digest;
  # the merge job then publishes one tag that points at both.
  images:
    name: Image ${{ matrix.image }} (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { image: shopnex, suffix: '', file: deploy/Dockerfile, arch: amd64, runner: ubuntu-latest }
          - { image: shopnex, suffix: '', file: deploy/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
          - {
              image: stripe,
              suffix: -stripe,
              file: deploy/Dockerfile.app,
              app: stripe,
              arch: amd64,
              runner: ubuntu-latest,
            }
          - {
              image: stripe,
              suffix: -stripe,
              file: deploy/Dockerfile.app,
              app: stripe,
              arch: arm64,
              runner: ubuntu-24.04-arm,
            }
          - {
              image: cj-dropshipping,
              suffix: -cj-dropshipping,
              file: deploy/Dockerfile.app,
              app: cj-dropshipping,
              arch: amd64,
              runner: ubuntu-latest,
            }
          - {
              image: cj-dropshipping,
              suffix: -cj-dropshipping,
              file: deploy/Dockerfile.app,
              app: cj-dropshipping,
              arch: arm64,
              runner: ubuntu-24.04-arm,
            }
          - {
              image: shippo,
              suffix: -shippo,
              file: deploy/Dockerfile.app,
              app: shippo,
              arch: amd64,
              runner: ubuntu-latest,
            }
          - {
              image: shippo,
              suffix: -shippo,
              file: deploy/Dockerfile.app,
              app: shippo,
              arch: arm64,
              runner: ubuntu-24.04-arm,
            }
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.image == 'shopnex' && format('APP_VERSION={0}', github.ref_name) || format('APP={0}', matrix.app) }}
          platforms: linux/${{ matrix.arch }}
          # Attestations would add extra "unknown" platforms to the merged tag
          provenance: false
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }} tags
    needs: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: shopnex, suffix: '' }
          - { image: stripe, suffix: -stripe }
          - { image: cj-dropshipping, suffix: -cj-dropshipping }
          - { image: shippo, suffix: -shippo }
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch tags
        env:
          TAG: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}"
          tags=(-t "$image:$TAG")
          # Pre-releases (v1.0.0-rc.1) don't move the latest tag
          if [[ "$TAG" != *-* ]]; then tags+=(-t "$image:latest"); fi
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:$TAG"

  release:
    name: Publish GitHub release
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tags like v1.0.0-rc.1 are marked as pre-releases
          flags="--generate-notes --verify-tag"
          if [[ "$TAG" == *-* ]]; then flags="$flags --prerelease"; fi
          # The release may already exist (created by hand or by a re-run); reuse it
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it"
          else
            gh release create "$TAG" $flags --title "$TAG"
          fi

      # The first image in each pull request's description goes under its entry in the notes. Nice-to-have: a
      # failure here leaves the plain generated notes and never fails the release.
      - name: Add pull request screenshots to release notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          node scripts/release-notes-images.mjs release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md

      - name: Attach images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          # Offline copies (linux/amd64), load with: gunzip -c <file> | docker load
          for ref in "$IMAGE:$TAG" "$IMAGE-stripe:$TAG"; do
            docker pull --platform linux/amd64 "$ref"
            file="$(basename "${ref%%:*}")-$TAG-linux-amd64.tar.gz"
            docker save "$ref" | gzip > "$file"
            gh release upload "$TAG" "$file"
          done

      - name: Add image reference to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          STRIPE_IMAGE: ${{ steps.image.outputs.name }}-stripe
          CJ_IMAGE: ${{ steps.image.outputs.name }}-cj-dropshipping
          SHIPPO_IMAGE: ${{ steps.image.outputs.name }}-shippo
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          {
            printf '\n\n## Docker image\n\n'
            printf 'ShopNex: `docker pull %s:%s`\n\n' "$IMAGE" "$TAG"
            printf 'Stripe app: `docker pull %s:%s`\n\n' "$STRIPE_IMAGE" "$TAG"
            printf 'CJ Dropshipping app (optional): `docker pull %s:%s`\n\n' "$CJ_IMAGE" "$TAG"
            printf 'Shippo app (optional): `docker pull %s:%s`\n\n' "$SHIPPO_IMAGE" "$TAG"
            printf 'Images are published for linux/amd64 and linux/arm64. Offline `.tar.gz` copies of both (amd64) are attached below.\n'
          } >> release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md

      # Releases created with GITHUB_TOKEN do not trigger other workflows, so the `release` trigger in
      # landing-rebuild.yaml never fires for them. Call the deploy hook here, after the notes are final, so
      # shopnex.ai/changelog picks the release up. Optional: skipped when the secret is not set.
      - name: Rebuild landing
        env:
          HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "LANDING_DEPLOY_HOOK is not set; skipping"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"

  # What `npx create-shopnex` downloads: the admin, the storefront and the migrations in one file, plain JavaScript
  # and WebAssembly, so a single asset serves every OS and CPU (scripts/build-node-bundle.mjs).
  node-bundle:
    name: Attach the npx bundle
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --dir templates/storefront build

      - name: Build and attach
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/build-node-bundle.mjs "${TAG#v}" "$RUNNER_TEMP/bundle"
          gh release upload "$TAG" "$RUNNER_TEMP"/bundle/shopnex-*-node.tgz "$RUNNER_TEMP"/bundle/shopnex-*-node.tgz.sha256 --clobber

  # Publishes create-shopnex to npm once the release and its bundle are attached (it downloads the bundle of its own
  # version, so it must never be published before that). It uses npm trusted publishing, so there is no npm token:
  # create-shopnex's Trusted Publisher settings on npmjs.com name this repository and this file (release.yaml).
  # Pre-releases (v1.0.0-rc.1) go to the `next` dist-tag and leave `latest` alone.
  npm:
    name: Publish create-shopnex to npm
    needs: node-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer
          npm --version
          version="${TAG#v}"
          package="$(node -p "require('./packages/create-shopnex/package.json').version")"
          if [ "$package" != "$version" ]; then
            echo "packages/create-shopnex is $package but the tag is $version: run pnpm bump before tagging" >&2
            exit 1
          fi
          # A re-run of a tag that already published
          if npm view "create-shopnex@$version" version > /dev/null 2>&1; then
            echo "create-shopnex@$version is already on npm"
            exit 0
          fi
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          cd packages/create-shopnex
          npm publish --provenance --access public --tag "$dist_tag"
