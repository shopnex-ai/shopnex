name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR replaces the older run; runs on main always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Docs-only pull requests skip the app image and e2e jobs. The skipped jobs still satisfy the required checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            other=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '\.(md|mdx)$|^docs/|^apps/docs/' || true)
            [ -z "$other" ] && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Only the files this PR changes: the codebase isn't fully formatted yet, so a repo-wide check would fail
      - name: Format (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" -z | xargs -0 --no-run-if-empty pnpm exec prettier --check --ignore-unknown

      - run: pnpm typecheck

      # The Admin API types in @shopnex/app are generated from the router: a route change needs `pnpm --filter @shopnex/app generate`
      - name: Admin API types are up to date
        run: pnpm --filter @shopnex/app generate && git diff --exit-code packages/app/src/admin-api.gen.ts

      - run: pnpm test

      - run: pnpm build

  app-image:
    name: App image (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [stripe, cj-dropshipping]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: scripts/smoke-app.sh ${{ matrix.app }}

  # The real Caddyfile in front of stub apps: X-Forwarded-Proto from a TLS-terminating proxy must reach the apps
  proxy-headers:
    name: Proxy headers
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: scripts/smoke-proxy.sh

  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopnex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shopnex
      SHOPNEX_SECRET: ci-only-shopnex-secret-ci-only-shopnex
      APP_URL: http://localhost:3000
      STOREFRONT_URL: http://localhost:4321
      DEMO_OWNER_EMAIL: owner@example.com
      DEMO_OWNER_PASSWORD: ci-owner-Passw0rd!
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm --dir templates/storefront build

      - run: pnpm db:migrate

      # An empty database with a shop, accounts and the demo catalog (the tests need active, in-stock variants)
      - run: pnpm demo:seed

      - name: Start the app and the storefront
        run: |
          (cd apps/admin-ui && PORT=3000 node server.mjs > "$RUNNER_TEMP/app.log" 2>&1) &
          (cd templates/storefront && HOST=127.0.0.1 PORT=4321 SHOPNEX_URL=http://localhost:3000 \
            node dist/server/entry.mjs > "$RUNNER_TEMP/storefront.log" 2>&1) &
          npx --yes wait-on@8 -t 60000 http-get://localhost:3000/api/v1/storefront/shop http://localhost:4321/

      # Same tests as `pnpm e2e`, plus a JUnit file for the public test report
      - run: pnpm --filter @shopnex/e2e test:ci

      # The browser comes from Playwright's own CDN. `install-deps` then runs apt for the system packages the runner lacks
      # (in practice only fonts), and when Ubuntu's mirrors stopped resolving it hung for many minutes and failed the whole
      # job before any test ran. It is now limited to 3 minutes and only warns: if a library really were missing, the
      # browser tests fail with that error instead.
      - name: Install the browser
        run: |
          pnpm --dir e2e exec playwright install chromium
          timeout -k 10 180 pnpm --dir e2e exec playwright install-deps chromium \
            || echo "::warning::Could not install the system packages (apt unreachable?); using what the runner has"

      - name: Browser tests
        run: pnpm --dir e2e test:browser

      - name: Browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Server logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/app.log" "$RUNNER_TEMP/storefront.log"

      # The public test report: results.json for shopnex.ai/testing and the Playwright HTML report.
      # Built on every run of main, also when a test failed, so a red run is published too.
      - name: Build the test report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/e2e-summary.mjs report-site

      - name: Upload the test report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: test-report-site
          path: report-site
          if-no-files-found: ignore

  # Publishes the latest main run to GitHub Pages (https://shopnex-ai.github.io/shopnex/results.json).
  # Needs Settings > Pages > Source: GitHub Actions. Until that is on, this job fails without failing CI.
  publish-report:
    name: Publish test report
    needs: e2e
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-report-site
          path: report-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: report-site
      - id: deploy
        uses: actions/deploy-pages@v5
