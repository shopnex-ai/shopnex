name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR replaces the older run; runs on main always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Docs-only pull requests skip the app image and e2e jobs. The skipped jobs still satisfy the required checks.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            other=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '\.(md|mdx)$|^docs/|^apps/docs/' || true)
            [ -z "$other" ] && code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-aware lint of the strict modules: about 2 GB with six of them (measured), growing with each one that joins. All twenty at
      # once ran out of Node's default 4 GB, so the limit is raised before it is reached.
      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # Each module's imports, package.json and manifest agree, and the module graph has no cycle (see scripts/modules-check.mjs)
      - run: pnpm modules:check

      # The admin UI's client code takes no server code from the packages it imports (the browser fails at runtime otherwise)
      - run: pnpm bundle:check

      # Only the files this PR changes: the codebase isn't fully formatted yet, so a repo-wide check would fail
      - name: Format (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" -z | xargs -0 --no-run-if-empty pnpm exec prettier --check --ignore-unknown

      - run: pnpm typecheck

      # The Admin API types in @shopnex/app are generated from the router: a route change needs `pnpm --filter @shopnex/app generate`
      - name: Admin API types are up to date
        run: pnpm --filter @shopnex/app generate && git diff --exit-code packages/app/src/admin-api.gen.ts

      # The tables (modules/db and every modules/*/src/*.schema.ts) and the migrations must agree: a table change without
      # its migration, or a table moved between modules, shows up as a new migration file here
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain modules/db/migrations)" ]; then
            git status --short modules/db/migrations
            echo "::error::The schema has changes with no migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

      - run: pnpm build

  # The unit tests run beside lint and typecheck, not after them: they need neither, and in one job they were the longest step
  # (each test file boots its own in-memory database). They are split over two runners by scripts/test-shard.mjs, which gives
  # every package with tests to exactly one shard.
  unit-test-shards:
    name: Unit tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/test-shard.mjs ${{ matrix.shard }} 2

  # One check for the shards, so the name in the required checks does not change when the number of shards does. Add "Unit tests"
  # (this job) to the required checks next to "Lint, typecheck, build".
  unit-tests:
    name: Unit tests
    needs: unit-test-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.unit-test-shards.result }}
        run: |
          echo "unit test shards: $RESULT"
          test "$RESULT" = success

  app-image:
    name: App image (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [stripe, cj-dropshipping]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: scripts/smoke-app.sh ${{ matrix.app }}

  # The real Caddyfile in front of stub apps: X-Forwarded-Proto from a TLS-terminating proxy must reach the apps
  proxy-headers:
    name: Proxy headers
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - run: scripts/smoke-proxy.sh

  # The API tests and the browser tests are two jobs, each with its own database and its own running app: they share only the demo
  # seed, and in one job they ran one after the other. Both are required checks: "End-to-end tests" and "Browser tests".
  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopnex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shopnex
      SHOPNEX_SECRET: ci-only-shopnex-secret-ci-only-shopnex
      APP_URL: http://localhost:3000
      STOREFRONT_URL: http://localhost:4321
      DEMO_OWNER_EMAIL: owner@example.com
      DEMO_OWNER_PASSWORD: ci-owner-Passw0rd!
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-app

      # Same tests as `pnpm e2e`, plus a JUnit file for the public test report
      - run: pnpm --filter @shopnex/e2e test:ci

      - name: Server logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/app.log" "$RUNNER_TEMP/storefront.log"

      - name: API test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-results
          path: e2e/api-results.xml
          if-no-files-found: ignore

  browser:
    name: Browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopnex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/shopnex
      SHOPNEX_SECRET: ci-only-shopnex-secret-ci-only-shopnex
      APP_URL: http://localhost:3000
      STOREFRONT_URL: http://localhost:4321
      DEMO_OWNER_EMAIL: owner@example.com
      DEMO_OWNER_PASSWORD: ci-owner-Passw0rd!
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-app

      # The browser comes from Playwright's own CDN. `install-deps` then runs apt for the system packages the runner lacks
      # (in practice only fonts), and when Ubuntu's mirrors stopped resolving it hung for many minutes and failed the whole
      # job before any test ran. It is now limited to 3 minutes and only warns: if a library really were missing, the
      # browser tests fail with that error instead.
      - name: Install the browser
        run: |
          pnpm --dir e2e exec playwright install chromium
          timeout -k 10 180 pnpm --dir e2e exec playwright install-deps chromium \
            || echo "::warning::Could not install the system packages (apt unreachable?); using what the runner has"

      - name: Browser tests
        run: pnpm --dir e2e test:browser

      # Collected into one folder first: upload-artifact roots an artifact at the common folder of the files it finds, so a run
      # that left only some of them would otherwise come out with a different layout
      - name: Collect the browser test report
        if: always()
        run: |
          mkdir -p browser-results
          cp -r e2e/playwright-report e2e/test-results browser-results/ 2>/dev/null || true
          cp e2e/playwright-results.json browser-results/ 2>/dev/null || true

      - name: Browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: browser-results
          if-no-files-found: ignore

      - name: Server logs
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/app.log" "$RUNNER_TEMP/storefront.log"

  # The public test report: results.json for shopnex.ai/testing and the Playwright HTML report, from both jobs' results.
  # Built on every run of main, also when a test failed, so a red run is published too.
  report:
    name: Build the test report
    needs: [e2e, browser]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.e2e.result != 'skipped' && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # A job that failed before its tests ran has nothing to give: the report then says so for that half
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: api-results
          path: e2e

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: playwright-report
          path: e2e

      - run: node scripts/e2e-summary.mjs report-site

      - uses: actions/upload-artifact@v7
        with:
          name: test-report-site
          path: report-site
          if-no-files-found: ignore

  # Publishes the latest main run to GitHub Pages (https://shopnex-ai.github.io/shopnex/results.json).
  # Needs Settings > Pages > Source: GitHub Actions (it is on). A failure here is a real failure, so CI shows it.
  publish-report:
    name: Publish test report
    needs: report
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: test-report-site
          path: report-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: report-site
      - id: deploy
        uses: actions/deploy-pages@v5
