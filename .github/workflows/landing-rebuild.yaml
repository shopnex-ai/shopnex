name: Rebuild landing

# shopnex.ai/roadmap is prerendered from the public GitHub project https://github.com/orgs/shopnex-ai/projects/8 and
# shopnex.ai/changelog from GitHub Releases, so the site must rebuild when either changes. Project edits send no
# repository event, so the roadmap is picked up by the hourly schedule.
# Needs the LANDING_DEPLOY_HOOK repo secret (a Cloudflare deploy hook URL for the landing project).
on:
  schedule:
    - cron: '17 * * * *'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger landing deploy
        env:
          HOOK: ${{ secrets.LANDING_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "LANDING_DEPLOY_HOOK is not set; skipping"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
