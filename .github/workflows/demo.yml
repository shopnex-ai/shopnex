name: Demo image

# Builds the Docker image and pushes it to GHCR (ghcr.io/<owner>/<repo>:edge) for the demo, plus the
# Stripe, CJ Dropshipping and Shippo app images (<repo>-stripe:edge, <repo>-cj-dropshipping:edge, <repo>-shippo:edge).
# :latest is reserved for releases (multi-arch, see release.yaml).
# The Dokploy app uses Provider "Docker" with :edge. If the DOKPLOY_WEBHOOK_URL secret (the app's deploy
# webhook from Dokploy: Deployments > Webhook URL) is set, a redeploy is triggered after the push; otherwise
# it only pushes. This never touches the app's environment in Dokploy.

on:
  push:
    branches: [main]
    # Everything except docs, plus the install script (it lives under apps/docs/public): the Install script
    # workflow tests it against the images this one pushes. A later pattern re-includes what an earlier ! removed.
    paths:
      - '**'
      - '!**/*.md'
      - '!apps/docs/**'
      - apps/docs/public/install.sh
  workflow_dispatch:

concurrency:
  group: demo-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:edge
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.app
          build-args: APP=stripe
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-stripe:edge
            ${{ steps.image.outputs.name }}-stripe:${{ github.sha }}
          cache-from: type=gha,scope=stripe
          cache-to: type=gha,mode=max,scope=stripe

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.app
          build-args: APP=cj-dropshipping
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-cj-dropshipping:edge
            ${{ steps.image.outputs.name }}-cj-dropshipping:${{ github.sha }}
          cache-from: type=gha,scope=cj-dropshipping
          cache-to: type=gha,mode=max,scope=cj-dropshipping

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.app
          build-args: APP=shippo
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-shippo:edge
            ${{ steps.image.outputs.name }}-shippo:${{ github.sha }}
          cache-from: type=gha,scope=shippo
          cache-to: type=gha,mode=max,scope=shippo

      - name: Deploy on Dokploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "Dokploy not configured, image pushed only"
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_WEBHOOK_URL" -H "Content-Type: application/json" \
              -d '{}' -o /dev/null
          echo "Deploy triggered for ${{ steps.image.outputs.name }}:${{ github.sha }}"
