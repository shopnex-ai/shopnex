# Shopnex with its database and the Stripe app, each in its own container:
#
#   APP_URL=http://localhost:3000 STRIPE_APP_URL=http://localhost:4600 docker compose up --build
# (or put those two in a .env file). For contributors who build from source; to just run Shopnex use
# deploy/docker-compose.yml, which pulls prebuilt GHCR images and needs no setup.
#
# The apps are separate containers on their own public URL (a subdomain each), because browsers and Stripe
# reach them directly. Put a reverse proxy / platform routing in front of 3000 (Shopnex) and 4600 (Stripe).
# Not "shopnex": deploy/docker-compose.yml uses that project name, and both would share the `db` volume while using
# different Postgres users, so whichever you ran second could not connect ("role shopnex does not exist").
name: shopnex-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shopnex
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  admin:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports:
      - '3000:3000'
    volumes:
      - data:/data
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shopnex
      APP_URL: '${APP_URL:?required: public origin of Shopnex}'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # Registers the Stripe app (Settings → Payments → Install): where to find it
      STRIPE_APP_URL: '${STRIPE_APP_URL:?required: public origin of the Stripe app}'

  stripe:
    build:
      context: .
      dockerfile: Dockerfile.app
      args: { APP: stripe }
    ports:
      - '4600:4600'
    volumes:
      - stripe_data:/data # the app's identity and its shops' settings: keep it
    environment:
      STRIPE_APP_URL: '${STRIPE_APP_URL:?required}'
      DATA_DIR: /data

volumes:
  db:
  data:
  stripe_data:
